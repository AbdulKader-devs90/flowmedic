[project]
name = "flowmedic"
version = "0.1.0"
description = "Diagnose the break. Guide the fix."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langchain",
    "langgraph",
    "langchain-anthropic",
    "langchain-openai",
    "langsmith",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pyyaml",
    "pinecone>=7,<8",
    "chromadb>=1,<2",
    "mcp>=1.30.0",
    "langchain-mcp-adapters>=0.3.2",
    "tavily-python>=0.8.5",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "fastapi>=0.162.1",
    "uvicorn>=0.54.0",
    "sse-starlette>=3.6.0",
    "python-multipart>=0.0.33",
]

[project.scripts]
flowmedic-api = "flowmedic.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --basetemp=.cache/pytest"
markers = ["live: calls real provider APIs (opt in with -m live)"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["flowmedic", "mcp_servers"]
